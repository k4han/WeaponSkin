plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.3.1"
    id("com.modrinth.minotaur") version "2.9.0"
}

group = 'me.k4han'
version = '1.1.0'

def targetJavaVersion = 21
def paperApiVersion = findProperty('paperApiVersion') ?: '1.21.11-R0.1-SNAPSHOT'
def dependencyJvmVersion = paperApiVersion.toString().startsWith('26.') ? 25 : targetJavaVersion
def resolvedReleaseVersion = (findProperty("releaseVersion") ?: project.version).toString()

configurations.matching {
    it.name in ['compileClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, dependencyJvmVersion)
}

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    // PacketEvents
    maven { url 'https://repo.codemc.io/repository/maven-releases/' }

    // Oraxen
    maven { url 'https://repo.oraxen.com/releases' }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")

    // PacketEvents — provided (plugin riêng trên server)
    compileOnly 'com.github.retrooper:packetevents-spigot:2.11.2'

    // Oraxen — provided (plugin riêng trên server)
    compileOnly 'io.th0rgal:oraxen:1.207.0'

    // bStats — metrics
    implementation 'org.bstats:bstats-bukkit:3.2.0'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation "io.papermc.paper:paper-api:${paperApiVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }
}

tasks.shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.runtimeClasspath]

    dependencies {
        // Only merge bStats into the final jar, no other dependencies
        exclude { it.moduleGroup != "org.bstats" }
    }

    // Relocate bStats into the plugin's package to avoid conflicts
    relocate("org.bstats", project.group.toString())
}

tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn shadowJar
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = System.getenv("MODRINTH_PROJECT_ID")
    versionNumber = resolvedReleaseVersion
    versionName = "WeaponSkin ${resolvedReleaseVersion}"
    versionType = System.getenv("MODRINTH_VERSION_TYPE") ?: "release"
    uploadFile = tasks.shadowJar
    gameVersions = csvEnv("MODRINTH_GAME_VERSIONS", "1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11,26.1.1,26.1.2")
    loaders = csvEnv("MODRINTH_LOADERS", "paper,purpur,folia")
    changelog = System.getenv("MODRINTH_CHANGELOG") ?: "See the GitHub release notes."
    debugMode = (System.getenv("MODRINTH_DEBUG") ?: "false").toBoolean()
}

tasks.named('modrinth') {
    dependsOn tasks.named('shadowJar')
}

static List<String> csvEnv(String name, String fallback) {
    return (System.getenv(name) ?: fallback)
            .split(',')
            .collect { it.trim() }
            .findAll { !it.isBlank() }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
