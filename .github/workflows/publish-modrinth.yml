name: Publish to Modrinth

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: release-version
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        shell: bash
        run: |
          expected="${{ steps.release-version.outputs.value }}"
          actual="$(grep -E "^version = " build.gradle | sed -E "s/version = ['\"]([^'\"]+)['\"]/\1/")"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release tag version ($expected) does not match build.gradle version ($actual)"
            exit 1
          fi

      - name: Validate Modrinth configuration
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Missing required repository secret MODRINTH_TOKEN"
            exit 1
          fi
          if [ -z "$MODRINTH_PROJECT_ID" ]; then
            echo "::error::Missing required repository secret MODRINTH_PROJECT_ID"
            exit 1
          fi

      - name: Build and publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          MODRINTH_CHANGELOG: ${{ github.event.release.body }}
          MODRINTH_GAME_VERSIONS: ${{ vars.MODRINTH_GAME_VERSIONS || '1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11,26.1.1,26.1.2' }}
          MODRINTH_LOADERS: ${{ vars.MODRINTH_LOADERS || 'paper,purpur,folia' }}
          MODRINTH_VERSION_TYPE: ${{ vars.MODRINTH_VERSION_TYPE || 'release' }}
        run: ./gradlew clean build modrinth -PreleaseVersion="${{ steps.release-version.outputs.value }}"
